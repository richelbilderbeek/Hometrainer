# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
name: Create Zensical website

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build.yaml
      - .github/workflows/create_zensical_website.yaml
      - '*.cpp'
      - '*.h'
      - '*.pri'
      - '*.pro'
      - '*.qrc'
      - '*.ui'
      - 'docs/**'
      - 'resources/**'
      - zensical.toml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  create_zensical_website:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hometrainer_windows
          path: hometrainer_windows
      - run: zip -r docs/hometrainer_windows.zip hometrainer_windows
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
